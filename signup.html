<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - City Route Finder</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url("https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            color: #176b87;

            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            margin-bottom: 17px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #176b87;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #176b87;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0f5269;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-text a {
            color: #176b87;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="signup-box">

        <div class="logo">
            📍 City Route Finder
        </div>

        <h2 class="title">
            Create Account
        </h2>

        <p class="subtitle">
            Sign up to find your best route
        </p>


        <form onsubmit="createAccount(event)">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p
            class="message"
            id="message">
        </p>


        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <script>

        function createAccount(event) {

            event.preventDefault();


            let name =
                document.getElementById("name").value;

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            let message =
                document.getElementById("message");


            /* Check password */

            if (password !== confirmPassword) {

                message.style.color = "red";

                message.innerText =
                    "Passwords do not match!";

                return;
            }


            /* Save account */

            let user = {

                name: name,
                email: email,
                password: password

            };


            localStorage.setItem(
                "cityRouteUser",
                JSON.stringify(user)
            );


            message.style.color = "green";

            message.innerText =
                "Account created successfully!";


            /* Go to Login */

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        }

    </script>

</body>

</html>
